# Extract data from Supabase, build and test the dbt warehouse, export dashboard
# metrics, and deploy site/ to Vercel. Runs on every push to main, every morning
# at 6:00 UTC, and on demand from the Actions tab.
name: Pipeline and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt

      - name: Install dependencies
        working-directory: warehouse
        run: pip install -r requirements.txt

      - name: Extract raw tables
        working-directory: warehouse
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python extract.py

      - name: Build models and run data quality tests
        working-directory: warehouse
        run: dbt build --profiles-dir .

      - name: Export dashboard metrics
        working-directory: warehouse
        run: python export_dashboard.py

      - name: Deploy to Vercel
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest link --yes --project second-serving-app --scope second-serving --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --scope second-serving --token "$VERCEL_TOKEN"
